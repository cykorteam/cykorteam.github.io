  <!--KaTeX-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js" integrity="sha384-g7c+Jr9ZivxKLnZTDUhnkOnsh30B4H0rpLUpJ4jAIKs4fnJI+sEnkvrMWph2EDg4" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQFJfxn0IYznZYonOWZ644AWYC+Pt2cHqMaRhXVrursRwvLnLaebdGIlYNa" crossorigin="anonymous"></script>
  <script>
      document.addEventListener("DOMContentLoaded", function() {
          var mathRoot = document.querySelector(".c-article__main") || document.body;

          function updateMathState(text, inMath) {
              if (!text) {
                  return { inMath: inMath, enteredMath: false };
              }
              var enteredMath = false;
              for (var i = 0; i < text.length; i++) {
                  var ch = text[i];
                  if (ch === "\\\\") {
                      i += 1;
                      continue;
                  }
                  if (ch === "$") {
                      if (i + 1 < text.length && text[i + 1] === "$") {
                          i += 1;
                      }
                      inMath = !inMath;
                      if (inMath) {
                          enteredMath = true;
                      }
                  }
              }
              return { inMath: inMath, enteredMath: enteredMath };
          }

          function markEmphasisOverMath(root) {
              var walker = document.createTreeWalker(
                  root,
                  NodeFilter.SHOW_TEXT,
                  {
                      acceptNode: function(node) {
                          if (!node.nodeValue) {
                              return NodeFilter.FILTER_REJECT;
                          }
                          var parent = node.parentElement;
                          if (!parent) {
                              return NodeFilter.FILTER_REJECT;
                          }
                          if (parent.closest("pre, code, kbd, samp, .katex")) {
                              return NodeFilter.FILTER_REJECT;
                          }
                          return NodeFilter.FILTER_ACCEPT;
                      }
                  }
              );

              var inMath = false;
              var marked = new Set();
              var nodes = [];
              while (walker.nextNode()) {
                  nodes.push(walker.currentNode);
              }

              for (var i = 0; i < nodes.length; i++) {
                  var node = nodes[i];
                  var result = updateMathState(node.nodeValue, inMath);
                  var hasMath = inMath || result.enteredMath;
                  inMath = result.inMath;
                  if (!hasMath) {
                      continue;
                  }
                  var el = node.parentElement;
                  while (el) {
                      var tag = el.tagName;
                      if (tag === "EM" || tag === "I" || tag === "STRONG" || tag === "B") {
                          marked.add(el);
                      }
                      el = el.parentElement;
                  }
              }

              var ordered = Array.from(marked);
              ordered.sort(function(a, b) {
                  var depthA = 0;
                  var depthB = 0;
                  var cur = a;
                  while (cur) {
                      depthA += 1;
                      cur = cur.parentElement;
                  }
                  cur = b;
                  while (cur) {
                      depthB += 1;
                      cur = cur.parentElement;
                  }
                  return depthB - depthA;
              });

              for (var j = 0; j < ordered.length; j++) {
                  var el = ordered[j];
                  if (!el.parentElement) {
                      continue;
                  }
                  var marker = (el.tagName === "STRONG" || el.tagName === "B") ? "__" : "_";
                  el.replaceWith(document.createTextNode(marker + el.textContent + marker));
              }
          }

          markEmphasisOverMath(mathRoot);

          renderMathInElement(mathRoot, {
              delimiters: [
                  { left: "$$", right: "$$", display: true },
                  { left: "\\[", right: "\\]", display: true },
                  { left: "\\(", right: "\\)", display: false },
                  { left: "$", right: "$", display: false }
              ],
              throwOnError: false
          });
      });
  </script>
  <style>
    .katex { font-size: 1em !important;  color: #000000; } 
    
  </style>
