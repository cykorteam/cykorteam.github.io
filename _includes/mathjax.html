  <!--KaTeX-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js" integrity="sha384-g7c+Jr9ZivxKLnZTDUhnkOnsh30B4H0rpLUpJ4jAIKs4fnJI+sEnkvrMWph2EDg4" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQFJfxn0IYznZYonOWZ644AWYC+Pt2cHqMaRhXVrursRwvLnLaebdGIlYNa" crossorigin="anonymous"></script>
  <script>
      document.addEventListener("DOMContentLoaded", function() {
          function restoreUnderscoreInDollarMath(html) {
              var out = "";
              var i = 0;
              var inMath = false;
              while (i < html.length) {
                  var ch = html[i];
                  if (ch === "\\" && html[i + 1] === "$") {
                      out += "\\$";
                      i += 2;
                      continue;
                  }
                  if (ch === "$") {
                      if (html[i + 1] === "$") {
                          inMath = !inMath;
                          out += "$$";
                          i += 2;
                          continue;
                      }
                      inMath = !inMath;
                      out += "$";
                      i += 1;
                      continue;
                  }
                  if (inMath && ch === "\\" && html[i + 1] === "_") {
                      out += "_";
                      i += 2;
                      continue;
                  }
                  if (inMath && html.startsWith("<em>", i)) {
                      var endEm = html.indexOf("</em>", i + 4);
                      if (endEm !== -1) {
                          var inner = html.slice(i + 4, endEm);
                          if (inner[0] === "{") {
                              out += "_" + inner;
                          } else {
                              out += "_{" + inner + "}";
                          }
                          i = endEm + 5;
                          continue;
                      }
                  }
                  out += ch;
                  i += 1;
              }
              return out;
          }

          var mathRoot = document.querySelector(".c-article__main") || document.body;
          var targets = mathRoot.querySelectorAll("p, li, blockquote, td, th");
          for (var t = 0; t < targets.length; t++) {
              var el = targets[t];
              if (!el || !el.innerHTML || el.innerHTML.indexOf("$") === -1) {
                  continue;
              }
              if (el.closest("pre, code, kbd, samp")) {
                  continue;
              }
              el.innerHTML = restoreUnderscoreInDollarMath(el.innerHTML);
          }

          renderMathInElement(mathRoot, {
              delimiters: [
                  { left: "$$", right: "$$", display: true },
                  { left: "\\[", right: "\\]", display: true },
                  { left: "\\(", right: "\\)", display: false },
                  { left: "$", right: "$", display: false }
              ],
              throwOnError: false
          });
      });
  </script>
  <style>
    .katex { font-size: 1em !important;  color: #000000; } 
    
  </style>
