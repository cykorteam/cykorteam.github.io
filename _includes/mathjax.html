  <!--KaTeX-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js" integrity="sha384-g7c+Jr9ZivxKLnZTDUhnkOnsh30B4H0rpLUpJ4jAIKs4fnJI+sEnkvrMWph2EDg4" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQFJfxn0IYznZYonOWZ644AWYC+Pt2cHqMaRhXVrursRwvLnLaebdGIlYNa" crossorigin="anonymous"></script>
  <script>
      document.addEventListener("DOMContentLoaded", function() {
          var mathRoot = document.querySelector(".c-article__main") || document.body;
          var targets = mathRoot.querySelectorAll("p, li, blockquote, td, th");
          for (var t = 0; t < targets.length; t++) {
              var el = targets[t];
              if (!el || !el.textContent || el.textContent.indexOf("$") === -1) {
                  continue;
              }
              if (el.closest("pre, code, kbd, samp")) {
                  continue;
              }
              var inMath = false;
              var walker = document.createTreeWalker(
                  el,
                  NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT,
                  {
                      acceptNode: function(node) {
                          if (node.nodeType === Node.ELEMENT_NODE) {
                              var tag = node.tagName;
                              if (tag === "PRE" || tag === "CODE" || tag === "KBD" || tag === "SAMP") {
                                  return NodeFilter.FILTER_REJECT;
                              }
                          }
                          return NodeFilter.FILTER_ACCEPT;
                      }
                  }
              );
              var nodes = [];
              while (walker.nextNode()) {
                  nodes.push(walker.currentNode);
              }
              for (var i = 0; i < nodes.length; i++) {
                  var node = nodes[i];
                  if (node.nodeType === Node.TEXT_NODE) {
                      var txt = node.nodeValue || "";
                      for (var j = 0; j < txt.length; j++) {
                          var ch = txt[j];
                          if (ch === "\\" && txt[j + 1] === "$") {
                              j += 1;
                              continue;
                          }
                          if (ch === "$") {
                              if (txt[j + 1] === "$") {
                                  inMath = !inMath;
                                  j += 1;
                                  continue;
                              }
                              inMath = !inMath;
                          }
                      }
                  } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "EM" && inMath) {
                      var innerText = node.textContent || "";
                      var sub = innerText[0] === "{" ? "_" + innerText : "_{" + innerText + "}";
                      node.replaceWith(document.createTextNode(sub));
                  }
              }
          }

          renderMathInElement(mathRoot, {
              delimiters: [
                  { left: "$$", right: "$$", display: true },
                  { left: "\\[", right: "\\]", display: true },
                  { left: "\\(", right: "\\)", display: false },
                  { left: "$", right: "$", display: false }
              ],
              throwOnError: false
          });
      });
  </script>
  <style>
    .katex { font-size: 1em !important;  color: #000000; } 
    
  </style>
